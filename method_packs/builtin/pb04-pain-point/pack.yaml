id: pb04-pain-point
name: 红海突围 · 痛点微创新（PB-04）
version: "1.0"
author: 智库 PB-04
type: declarative
description: 大盘够大的红海里，从竞品 1–3 星差评提炼高频痛点做针对性改良，定价比同类高 10–15%。
tags: [红海, 微创新, VOC, 差评挖掘]
weights: {market_capacity: 0.25, competition: 0.15, trend: 0.15, differentiation: 0.35, margin_barrier: 0.10}
thresholds:
  competition: {top3_click_share_pass_max: 0.45, top3_click_share_warn_max: 0.55, median_reviews_pass_max: 1500, median_reviews_warn_max: 5000, listing_count_pass_max: 3000, listing_count_warn_max: 8000}
  demand: {min_weekly_search_volume: 2000, warn_weekly_search_volume: 1000}
defaults: {check_voc: true, check_ip: true}
lens: |
  用 PB-04 视角解读：评论门槛高不是否决理由，关键是能否找到提及率 ≥25% 的同一痛点并给出可落地的改良方案。
  从 VOC 样本和头部竞品里列出 3 个最可能的痛点、对应改良点和改良后的定价（同类 +10–15%），并核对改良后净利率仍 ≥22%。
