id: six-gates
name: 六道门风控定档
version: "1.0"
author: 智库
type: declarative
description: 下单前的最后一轮风控把关：合规→体量→盈利→趋势→产品原因→发货风险六道硬门槛依次过关才定档，运营难度只调节目标与备货、不否决。阈值为经验口径（C 级），非平台规则。
tags: [六道门, 风控, 通用, 硬门槛]

# 定档以六道门为准，五维分数只作参照（报告里写作「评分参照」）
decision:
  mode: gates

# 权重只影响参照分，不改变六道门结论；按方法的关注顺序给：盈利 > 竞争/体量 > 趋势 > 差异化
weights:
  margin_barrier: 0.30
  competition: 0.25
  market_capacity: 0.20
  trend: 0.15
  differentiation: 0.10

thresholds:
  six_gates:
    volume_pass_min: 3.0          # 站内头部月销 ÷ 目标月销 ≥ 3
    roi_pass_min: 1.20            # ROI ≥ 120%
    profit_pass_usd: 5.0          # 且单件净利 > $5
    profit_relax_usd: 10.0        # 或单件净利 > $10 直接过
    trend_pass_min: 0.7           # 目标月 ÷ 当前月 ≥ 0.7（下滑超 30% 不做）
    unsaturation_pass_min: 0.15   # 低评论档平均月销 ÷ 100–200 评论参照中位
    difficulty_hard_below: 10.0   # 难度 <10% 困难
    difficulty_easy_above: 15.0   # >15% 简单
    ref_reviews_min: 100          # 未饱和参照评论区下限
    ref_reviews_max: 200          # 未饱和参照评论区上限
    first_batch_months: 2.0       # 首批 = S × k × 2 个月
    first_batch_k: 1.0
    difficulty_hard_batch_factor: 0.5   # 困难档首批 ×0.5（待核对）
    trial_batch_max: 100          # 试款 50–100 件
    price_floor_usd: 15.0         # 初筛价格线
    commission: 0.15              # 平台佣金（欧洲/日本约 32%）
    cny_usd: 7.2                  # 汇率
    target_orders_default: 200    # 美国站目标月销默认值
  # 与六道门对齐的既有阈值：评论区间法与初筛价格线本来就是同一口径
  competition:
    low_review_max: 30
    review_band_pass_min: 15.0
    review_band_warn_min: 10.0
  price:
    avg_price_pass_min: 15.0

defaults:
  check_ip: true
  check_voc: false
  check_peer_screen: true

# 数据源偏好：商品筛选优先用卖家精灵——接了卖家精灵就用它的口径拉商品样本；
# 只接 Sorftime 就用 Sorftime 同口径（价格/评论数/月销），再不行用西柚。
# keywords 只作用于趋势/需求类取数（西柚免费优先、SIF 付费回落）；
# 竞争格局固定 SIF 优先（月销/评论档字段只有它的 top_competitors 带全）。用户设置的路由优先于此。
data_sources:
  screen: [sellersprite, sorftime, xydc]
  keywords: [xydc, sif]

lens: |
  按六道门风控口径解读。
  定档只认六道门，顺序固定：合规门 → 体量门 → 盈利门 → 趋势门 → 产品原因门 → 发货风险门。
  - 六道门之前，方法要求先做三件事，报告里必须写出来：
    1) 同特征竞品集：3–10 个，判据是「消费者会不会犹豫」「爆了我会拿谁对比」「客户买的是什么」；
       填 peer_count。同特征不足 2 个 → 只能观察；不足 3 个 → 置信度最高「中」。
    2) 排异常：先排硬风险（受限、侵权），再排运营异常（合并评论、刷评、站外引流、品牌流量≤3个月新品、
       老代新、烧广告）。命中任一运营异常 → 降为观察；填 anomalies。
    3) 找头部用断崖法（30 天销量降序，找从断崖转平缓、相邻 1.3–1.5 倍的第一档）。
       没做断崖只能用竞品样本最大值，必须标「代理指标，需人工复核」。
  - fail 优先于 unknown：任何一门 fail 就是「不做」（仅发货风险门 fail 时降为「小批量试款」）。
  - 合规未检索、关键数据缺失 → 最高只能「观察」，不得写「做」。合规门含 IP、受限、类目证书、账号/品牌状态。
  - 产品原因门：热卖元素 / 性价比（低 ≥30%，只解释别人不作自营）/ 功能设计创新 / 未饱和 / 季节窗口，至少一条成立，
    并且要用「同类整体销量」验证，不看单个爆款。没有任何原因 → 不做，不能因为卖得好就做。
    可表达性前置：宽选品打法必须能用一张图表达客户最关心的点。
  - 运营难度（评论区间法）只调节目标与备货，不参与否决；>100% 属正常，不是异常。
  - 首批 = 同特征平均月销 S × 趋势系数 × 2 个月（填 peer_avg_monthly）；没填 S 时回落到目标月销，结果会标注偏高。
  - 体量用「头部 ÷ 目标 ≥ 3」，不是「目标 ≥ 某个绝对单量」；未饱和（低评论档月销 ÷ 100–200 评论参照中位 ≥ 0.15）
    与运营难度是两个指标，不要混。
  - 不猜采购价、不猜 CPC、不猜转化率；缺的写「待补」，并说明它让哪道门失效。
  - 代理指标必须标注「代理指标，需人工复核」。
  - 五维分数只作参照，不得用来推翻六道门结论。
  结论四档：做 / 小批量试款 / 观察 / 不做。置信度：高 = ≥3 同特征竞品 + 当天数据 + 两个原因交叉验证；低 → 只能观察。

notes: 阈值全部为经验口径（C 级），需按类目与当期后台复核；平台佣金、FBA、VAT、时限以亚马逊后台为准。
