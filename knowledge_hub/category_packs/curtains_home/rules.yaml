# 美国站窗帘（Window Curtains）专属深度门槛与实战红线规则
# 来源依据：《美国站窗帘运营工作台》实操模块 M01/M03/M05

sales_unit_check: "销售单位必须明确为双片装（Set of 2 Panels / Pair）。美国买家默认两片对开，若为单片装必须在主图与标题加粗警示，否则极易遭遇‘只收到一片’断崖式退货"
net_margin_hard_gate: "完整财务模型基准净利润率不得低于 6.0%，低于 6% 一票否决（结论为‘利润问题不值得投入’，样品、打样、备货预算全清零）"
target_size_portfolio: "核心黄金规格布局：宽度统一 52 英寸(约132cm)，长度梯度必须以 84L(主力走量 65%+)、63L(短窗 15%)、96L(高挑高 15%)、108L(豪华大窗 5%) 梯队组合"
blackout_fabric_standard: "全遮光款(100% Total Blackout)必须采用三层黑丝编织夹层或环保热熔复合白胶，实测强光照射零针孔透光，严禁有刺鼻甲醛异味"
vacuum_packaging_ratio: "包装体积重与实重比必须 ≤ 1.15。必须硬性配置大马力抽真空卷包装，强行压入标准大件(Standard Size)，杜绝越级跳档产生超额 FBA 配送费"
grommet_antirust_test: "内径 1.6 英寸金属气眼打孔环需通过 48 小时盐雾防锈测试，抗拉脱力 ≥ 150N，机洗不脱落"
return_rate_buffer: "因买家量错窗框尺寸与色差，美国家纺退货率通常在 5%~8%，财务模型必须预扣 7.5% 售后与退货损耗基金"
cpa_cpc_boundary_formula: "允许最高 CPA = 售价 P - 可变成本 C - 固定分摊 F - (P × 目标净利率 6%)；允许最高 CPC = 允许 CPA × 预计转化率 CVR(基准通常按 8%)"
